<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Journal - Mi Diario de Lecturas</title>
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel para procesar el código -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Mock de iconos (Lucide en HTML requiere este pequeño ajuste)
        const Icon = ({ name, ...props }) => {
            const [iconSvg, setIconSvg] = useState('');
            useEffect(() => {
                if (window.lucide) {
                    const icon = window.lucide.icons[name];
                    if (icon) setIconSvg(icon.toSvg(props));
                }
            }, [name]);
            return <span dangerouslySetInnerHTML={{ __html: iconSvg }} className="inline-block" />;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('read'); 
            const [books, setBooks] = useState([]);
            const [wishlist, setWishlist] = useState([]);
            const [isAdding, setIsAdding] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [loadingCover, setLoadingCover] = useState(false);
            
            const fileInputRef = useRef(null);
            const coverUploadRef = useRef(null);
            
            const [title, setTitle] = useState('');
            const [author, setAuthor] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [rating, setRating] = useState(0);
            const [hoverRating, setHoverRating] = useState(0);
            const [tempCoverUrl, setTempCoverUrl] = useState('');
            const [isFavorite, setIsFavorite] = useState(false);
            const [format, setFormat] = useState('');

            const colors = {
                rosa: '#e8608c',
                turquesa: '#71cbc4',
                crema: '#fff9f4',
                lima: '#cdd56e',
                naranja: '#ffbd68',
                textMain: '#2d3436'
            };

            const currentYearCount = books.filter(book => {
                if (!book.endDate) return false;
                return new Date(book.endDate).getFullYear() === new Date().getFullYear();
            }).length;

            const exportData = () => {
                const dataStr = JSON.stringify({ books, wishlist }, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `mi_diario_lecturas.json`;
                link.click();
            };

            const handleImport = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        if (json.books) setBooks(json.books);
                        if (json.wishlist) setWishlist(json.wishlist);
                    } catch (err) { alert("Error al importar el archivo"); }
                };
                reader.readAsText(file);
            };

            const handleManualCoverUpload = (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setTempCoverUrl(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleSave = (e) => {
                e.preventDefault();
                if (!title || !author || !format) return;
                const finalCover = tempCoverUrl || `https://images.unsplash.com/photo-1543003923-4350ffcc124c?q=80&w=400&auto=format&fit=crop`;

                const newItem = { 
                    id: editingId || Date.now(), title, author, startDate, endDate, rating, 
                    coverUrl: finalCover, isFavorite, format 
                };

                if (editingId) {
                    if (activeTab === 'read') setBooks(books.map(b => b.id === editingId ? newItem : b));
                    else setWishlist(wishlist.map(i => i.id === editingId ? newItem : i));
                } else {
                    if (activeTab === 'read') setBooks([newItem, ...books]);
                    else setWishlist([newItem, ...wishlist]);
                }
                resetForm();
                setIsAdding(false);
            };

            const resetForm = () => {
                setTitle(''); setAuthor(''); setStartDate(''); setEndDate(''); 
                setRating(0); setTempCoverUrl(''); setEditingId(null); 
                setIsFavorite(false); setFormat('');
            };

            const startEditing = (item) => {
                setEditingId(item.id); setTitle(item.title); setAuthor(item.author);
                setTempCoverUrl(item.coverUrl); setIsFavorite(item.isFavorite);
                setFormat(item.format);
                if (activeTab === 'read') {
                    setStartDate(item.startDate); setEndDate(item.endDate); setRating(item.rating);
                }
                setIsAdding(true);
            };

            return (
                <div className="min-h-screen pb-20" style={{ backgroundColor: colors.crema, color: colors.textMain }}>
                    {/* Header */}
                    <div className="bg-white/90 backdrop-blur-md border-b sticky top-0 z-20" style={{ borderColor: `${colors.turquesa}33` }}>
                        <header className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="p-3 rounded-[1.25rem] shadow-lg" style={{ backgroundColor: colors.rosa }}>
                                    <Icon name="BookOpen" stroke="white" />
                                </div>
                                <div>
                                    <h1 className="text-2xl font-light" style={{ color: colors.rosa }}>Book Journal</h1>
                                </div>
                            </div>
                            <div className="flex gap-4">
                                <button onClick={exportData} className="p-2.5 rounded-xl hover:bg-gray-100" style={{ color: colors.turquesa }}>
                                    <Icon name="Download" />
                                </button>
                                <button onClick={() => setIsAdding(!isAdding)} className="bg-[#e8608c] text-white px-6 py-2 rounded-xl font-bold text-xs uppercase tracking-widest shadow-lg">
                                    {isAdding ? 'Cerrar' : 'Añadir'}
                                </button>
                            </div>
                        </header>
                    </div>

                    <main className="max-w-6xl mx-auto px-6 mt-12">
                        {/* Tabs */}
                        <div className="flex gap-4 mb-10">
                            <button onClick={() => setActiveTab('read')} className={`px-10 py-4 rounded-2xl border-2 transition-all font-bold text-xs ${activeTab === 'read' ? 'bg-[#71cbc4] text-white' : 'bg-white text-[#71cbc4]'}`} style={{ borderColor: colors.turquesa }}>
                                BIBLIOTECA
                            </button>
                            <button onClick={() => setActiveTab('wishlist')} className={`px-10 py-4 rounded-2xl border-2 transition-all font-bold text-xs ${activeTab === 'wishlist' ? 'bg-[#71cbc4] text-white' : 'bg-white text-[#71cbc4]'}`} style={{ borderColor: colors.turquesa }}>
                                WISHLIST
                            </button>
                        </div>

                        {/* Form */}
                        {isAdding && (
                            <div className="bg-white rounded-[2rem] shadow-2xl p-8 mb-12 border-4 animate-in" style={{ borderColor: colors.lima }}>
                                <form onSubmit={handleSave} className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div className="space-y-4">
                                        <input required placeholder="Título" className="w-full p-4 border-2 rounded-xl outline-none" style={{ borderColor: `${colors.turquesa}55` }} value={title} onChange={(e) => setTitle(e.target.value)} />
                                        <input required placeholder="Autor" className="w-full p-4 border-2 rounded-xl outline-none" style={{ borderColor: `${colors.turquesa}55` }} value={author} onChange={(e) => setAuthor(e.target.value)} />
                                        <div className="flex gap-2">
                                            <button type="button" onClick={() => setFormat('Papel')} className={`flex-1 p-3 rounded-xl border-2 ${format === 'Papel' ? 'bg-orange-100 border-orange-400' : 'bg-white'}`}>Papel</button>
                                            <button type="button" onClick={() => setFormat('Ebook')} className={`flex-1 p-3 rounded-xl border-2 ${format === 'Ebook' ? 'bg-blue-100 border-blue-400' : 'bg-white'}`}>Ebook</button>
                                        </div>
                                        <button type="button" onClick={() => coverUploadRef.current.click()} className="text-xs font-bold text-gray-400 uppercase tracking-widest">Subir Portada</button>
                                        <input type="file" ref={coverUploadRef} className="hidden" onChange={handleManualCoverUpload} />
                                    </div>
                                    <div className="flex flex-col justify-between">
                                        {activeTab === 'read' && (
                                            <div className="grid grid-cols-2 gap-4">
                                                <input type="date" className="p-4 border-2 rounded-xl" value={startDate} onChange={(e) => setStartDate(e.target.value)} />
                                                <input type="date" className="p-4 border-2 rounded-xl" value={endDate} onChange={(e) => setEndDate(e.target.value)} />
                                            </div>
                                        )}
                                        <button type="submit" className="w-full mt-4 bg-[#e8608c] text-white p-4 rounded-xl font-bold shadow-xl">GUARDAR LIBRO</button>
                                    </div>
                                </form>
                            </div>
                        )}

                        {/* List */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            {(activeTab === 'read' ? books : wishlist).map(book => (
                                <div key={book.id} className="bg-white rounded-[2rem] shadow-xl flex overflow-hidden h-64 animate-in">
                                    <img src={book.coverUrl} className="w-40 h-full object-cover" />
                                    <div className="p-6 flex-1 flex flex-col justify-between">
                                        <div>
                                            <h3 className="text-xl font-bold uppercase">{book.title}</h3>
                                            <p className="text-gray-400">{book.author}</p>
                                        </div>
                                        <div className="flex justify-between items-center">
                                            <span className="text-[10px] font-bold px-3 py-1 rounded-full bg-gray-100">{book.format}</span>
                                            <button onClick={() => setBooks(books.filter(b => b.id !== book.id))} className="text-red-300 hover:text-red-500">
                                                <Icon name="Trash2" size="20" />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
