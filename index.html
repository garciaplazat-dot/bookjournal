 <lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Journal - Mi Diario de Lectura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap');
        
        :root {
            --rosa: #e8608c;
            --turquesa: #71cbc4;
            --crema: #fff9f4;
            --lima: #cdd56e;
            --naranja: #ffbd68;
            --textMain: #2d3436;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--crema);
            color: var(--textMain);
        }

        .btn-rosa { background-color: var(--rosa); box-shadow: 0 10px 25px -5px rgba(232, 96, 140, 0.4); }
        .border-turquesa-soft { border-color: rgba(113, 203, 196, 0.2); }
        
        .tab-active {
            background-color: var(--turquesa) !important;
            color: white !important;
            box-shadow: 0 10px 20px -5px rgba(113, 203, 196, 0.4);
        }

        .format-btn.active-papel {
            border-color: var(--naranja);
            background-color: rgba(255, 189, 104, 0.1);
            color: var(--naranja);
        }

        .format-btn.active-ebook {
            border-color: var(--turquesa);
            background-color: rgba(113, 203, 196, 0.1);
            color: var(--turquesa);
        }

        .card-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
        }

        @keyframes fadeInZoom {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-form { animation: fadeInZoom 0.4s ease-out forwards; }
    </style>
</head>
<body class="pb-20">

    <!-- Cabecera -->
    <div class="bg-white/90 backdrop-blur-md border-b sticky top-0 z-20 border-turquesa-soft">
        <header class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="p-3 rounded-[1.25rem] btn-rosa text-white">
                    <i data-lucide="book-open" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-light tracking-tight" style="color: var(--rosa)">Book Journal</h1>
                    <p class="text-[10px] font-bold uppercase tracking-[0.2em] opacity-40">Pasión por leer</p>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-4">
                <div class="flex items-center gap-1 sm:gap-2 mr-2 pr-2 border-r border-gray-100">
                    <button onclick="document.getElementById('importInput').click()" class="p-2.5 rounded-xl transition-all hover:bg-gray-50" style="color: var(--turquesa)">
                        <i data-lucide="upload" class="w-5 h-5"></i>
                    </button>
                    <button onclick="exportData()" class="p-2.5 rounded-xl transition-all hover:bg-gray-50" style="color: var(--turquesa)">
                        <i data-lucide="download" class="w-5 h-5"></i>
                    </button>
                    <input type="file" id="importInput" class="hidden" accept=".json" onchange="handleImport(event)">
                </div>

                <div class="hidden md:flex flex-col items-end mr-4">
                    <div class="flex items-center gap-2" style="color: var(--turquesa)">
                        <i data-lucide="trending-up" class="w-4 h-4"></i>
                        <span id="yearCount" class="text-xl font-light">0</span>
                    </div>
                    <p class="text-[10px] font-bold uppercase opacity-50">Leídos este año</p>
                </div>

                <button onclick="toggleAddForm()" id="btnAdd" class="text-white p-3 sm:px-8 sm:py-3.5 rounded-[1.25rem] font-bold uppercase tracking-widest text-xs flex items-center gap-2 btn-rosa transition-all hover:scale-105 active:scale-95">
                    <i data-lucide="plus" id="btnIcon" class="w-5 h-5"></i>
                    <span id="btnText" class="hidden sm:inline">Añadir</span>
                </button>
            </div>
        </header>
    </div>

    <main class="max-w-6xl mx-auto px-6 mt-12">
        <!-- Navegación -->
        <div class="flex gap-4 mb-10">
            <button onclick="switchTab('read')" id="tabRead" class="tab-active px-10 py-4 rounded-2xl font-light transition-all border-2 border-turquesa-soft flex items-center gap-2">
                <i data-lucide="book" class="w-5 h-5"></i> BIBLIOTECA
            </button>
            <button onclick="switchTab('wishlist')" id="tabWish" class="px-10 py-4 rounded-2xl font-light transition-all border-2 border-turquesa-soft bg-white flex items-center gap-2 text-[#71cbc4]">
                <i data-lucide="bookmark" class="w-5 h-5"></i> WISHLIST
            </button>
        </div>

        <!-- Formulario (Oculto por defecto) -->
        <div id="formSection" class="hidden animate-form bg-white rounded-[3.5rem] shadow-2xl mb-16 border-4 overflow-hidden" style="border-color: var(--lima)">
            <div class="flex flex-col lg:flex-row">
                <div class="lg:w-80 p-10 flex flex-col items-center justify-center border-b lg:border-b-0 lg:border-r bg-[#fff9f4] border-gray-100">
                    <div id="coverContainer" class="w-52 h-72 bg-white rounded-[2.5rem] shadow-2xl border-4 border-dashed border-[#ffbd68] overflow-hidden flex items-center justify-center relative">
                        <div id="coverPlaceholder" class="text-center p-6">
                            <i data-lucide="image" class="w-12 h-12 mx-auto mb-3 opacity-20 text-[#e8608c]"></i>
                            <p class="text-[10px] font-bold uppercase opacity-40">Sin Imagen</p>
                        </div>
                        <img id="coverPreview" class="hidden w-full h-full object-cover" alt="Vista previa">
                        <div id="loader" class="hidden absolute inset-0 bg-white/90 backdrop-blur-md flex flex-col items-center justify-center p-4">
                            <i data-lucide="loader-2" class="w-10 h-10 animate-spin mb-4 text-[#71cbc4]"></i>
                            <p class="text-[8px] font-bold text-center uppercase tracking-widest opacity-60">Buscando portada...</p>
                        </div>
                    </div>
                    
                    <div class="mt-8 w-full space-y-3">
                        <button type="button" onclick="searchCover()" class="w-full py-3 px-4 bg-white border-2 border-[#ffbd68] text-[#ffbd68] rounded-2xl text-[9px] font-bold uppercase tracking-[0.2em] flex items-center justify-center gap-2 hover:scale-105 transition-all">
                            <i data-lucide="search" class="w-4 h-4"></i> Buscar Online
                        </button>
                        <button type="button" onclick="document.getElementById('manualCover').click()" class="w-full py-3 px-4 bg-white border-2 border-[#71cbc4] text-[#71cbc4] rounded-2xl text-[9px] font-bold uppercase tracking-[0.2em] flex items-center justify-center gap-2 opacity-50 hover:opacity-100 transition-all">
                            <i data-lucide="paperclip" class="w-4 h-4"></i> Subir foto
                        </button>
                        <input type="file" id="manualCover" class="hidden" accept="image/*" onchange="previewManualCover(event)">
                    </div>
                </div>

                <div class="flex-1 p-12">
                    <div class="flex items-center justify-between mb-10">
                        <div class="flex items-center gap-5">
                            <div class="w-3 h-12 rounded-full bg-[#e8608c]"></div>
                            <h2 id="formTitle" class="text-4xl font-light uppercase tracking-tighter">Registrar Lectura</h2>
                        </div>
                        <button type="button" onclick="toggleFavForm()" class="p-4 rounded-full transition-all" id="favBtnForm">
                            <i data-lucide="heart" id="favIconForm" class="w-8 h-8 text-gray-200"></i>
                        </button>
                    </div>
                    
                    <form onsubmit="saveBook(event)" class="space-y-8">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-3">
                                <label class="text-[10px] font-bold uppercase tracking-[0.3em] ml-1 opacity-40">Título</label>
                                <input id="title" required class="w-full p-6 bg-white border-2 border-[#71cbc4]/30 rounded-[2rem] outline-none focus:border-[#71cbc4]" placeholder="Ej: Rayuela">
                            </div>
                            <div class="space-y-3">
                                <label class="text-[10px] font-bold uppercase tracking-[0.3em] ml-1 opacity-40">Autor/a</label>
                                <input id="author" required class="w-full p-6 bg-white border-2 border-[#71cbc4]/30 rounded-[2rem] outline-none focus:border-[#71cbc4]" placeholder="Ej: Julio Cortázar">
                            </div>
                        </div>

                        <div class="space-y-3">
                            <label class="text-[10px] font-bold uppercase tracking-[0.3em] ml-1 opacity-40">Formato (Obligatorio)</label>
                            <div class="flex gap-4">
                                <button type="button" onclick="setFormat('Papel')" id="fmtPapel" class="format-btn flex-1 p-5 rounded-[1.5rem] border-2 border-gray-100 transition-all flex items-center justify-center gap-3 font-bold uppercase tracking-widest text-[10px] text-gray-300">
                                    <i data-lucide="library" class="w-5 h-5"></i> Papel
                                </button>
                                <button type="button" onclick="setFormat('Ebook')" id="fmtEbook" class="format-btn flex-1 p-5 rounded-[1.5rem] border-2 border-gray-100 transition-all flex items-center justify-center gap-3 font-bold uppercase tracking-widest text-[10px] text-gray-300">
                                    <i data-lucide="tablet" class="w-5 h-5"></i> Ebook
                                </button>
                            </div>
                        </div>

                        <div id="dateFields" class="grid grid-cols-2 gap-8">
                            <div class="space-y-3">
                                <label class="text-[10px] font-bold uppercase tracking-[0.3em] ml-1 opacity-40">Inicio</label>
                                <input type="date" id="startDate" class="w-full p-6 bg-white border-2 border-[#cdd56e]/30 rounded-[2rem] outline-none">
                            </div>
                            <div class="space-y-3">
                                <label class="text-[10px] font-bold uppercase tracking-[0.3em] ml-1 opacity-40">Fin</label>
                                <input type="date" id="endDate" class="w-full p-6 bg-white border-2 border-[#cdd56e]/30 rounded-[2rem] outline-none">
                            </div>
                        </div>

                        <div class="pt-8 border-t border-gray-50 flex flex-col sm:flex-row items-center justify-between gap-6">
                            <div id="starContainer" class="flex gap-3">
                                <!-- Estrellas generadas por JS -->
                            </div>
                            <button type="submit" class="w-full sm:w-auto text-white font-bold uppercase tracking-[0.2em] px-16 py-6 rounded-[2.5rem] btn-rosa shadow-2xl transition-all hover:scale-105 active:scale-95 flex items-center justify-center gap-3">
                                <i data-lucide="save" class="w-6 h-6"></i> Guardar Libro
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Listado -->
        <div id="booksGrid" class="grid grid-cols-1 md:grid-cols-2 gap-12">
            <!-- Libros generados por JS -->
        </div>
    </main>

    <script>
        let state = {
            activeTab: 'read',
            books: JSON.parse(localStorage.getItem('books') || '[]'),
            wishlist: JSON.parse(localStorage.getItem('wishlist') || '[]'),
            isAdding: false,
            editingId: null,
            form: {
                title: '', author: '', startDate: '', endDate: '', rating: 0, 
                coverUrl: '', isFavorite: false, format: ''
            }
        };

        function init() {
            renderStars();
            renderGrid();
            updateYearCount();
            lucide.createIcons();
        }

        function toggleAddForm() {
            state.isAdding = !state.isAdding;
            const form = document.getElementById('formSection');
            const btnIcon = document.getElementById('btnIcon');
            const btnText = document.getElementById('btnText');
            
            if (state.isAdding) {
                form.classList.remove('hidden');
                btnText.innerText = 'Cerrar';
                resetForm();
            } else {
                form.classList.add('hidden');
                btnText.innerText = 'Añadir';
            }
            updateIcons();
        }

        function resetForm() {
            state.editingId = null;
            state.form = { title: '', author: '', startDate: '', endDate: '', rating: 0, coverUrl: '', isFavorite: false, format: '' };
            document.getElementById('title').value = '';
            document.getElementById('author').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.getElementById('coverPreview').classList.add('hidden');
            document.getElementById('coverPlaceholder').classList.remove('hidden');
            document.getElementById('formTitle').innerText = state.activeTab === 'read' ? 'Registrar Lectura' : 'Añadir a Wishlist';
            document.getElementById('dateFields').style.display = state.activeTab === 'read' ? 'grid' : 'none';
            document.getElementById('starContainer').style.display = state.activeTab === 'read' ? 'flex' : 'none';
            
            updateStars();
            updateFormatBtns();
            updateFavForm();
        }

        function setFormat(f) {
            state.form.format = f;
            updateFormatBtns();
        }

        function updateFormatBtns() {
            const bPapel = document.getElementById('fmtPapel');
            const bEbook = document.getElementById('fmtEbook');
            bPapel.className = `format-btn flex-1 p-5 rounded-[1.5rem] border-2 transition-all flex items-center justify-center gap-3 font-bold uppercase tracking-widest text-[10px] ${state.form.format === 'Papel' ? 'active-papel' : 'border-gray-100 text-gray-300 bg-white'}`;
            bEbook.className = `format-btn flex-1 p-5 rounded-[1.5rem] border-2 transition-all flex items-center justify-center gap-3 font-bold uppercase tracking-widest text-[10px] ${state.form.format === 'Ebook' ? 'active-ebook' : 'border-gray-100 text-gray-300 bg-white'}`;
        }

        function renderStars() {
            const container = document.getElementById('starContainer');
            container.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => { state.form.rating = i; updateStars(); };
                btn.className = "transition-transform hover:scale-125 active:scale-90";
                btn.innerHTML = `<i data-lucide="star" class="w-10 h-10 star-icon text-gray-100"></i>`;
                container.appendChild(btn);
            }
            lucide.createIcons();
        }

        function updateStars() {
            const stars = document.querySelectorAll('.star-icon');
            stars.forEach((s, idx) => {
                if (idx < state.form.rating) {
                    s.classList.add('fill-current', 'text-[#ffbd68]');
                    s.classList.remove('text-gray-100');
                } else {
                    s.classList.remove('fill-current', 'text-[#ffbd68]');
                    s.classList.add('text-gray-100');
                }
            });
        }

        async function searchCover() {
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            if (!title) return;

            const loader = document.getElementById('loader');
            loader.classList.remove('hidden');

            const apiKey = ""; // API Key de entorno
            const prompt = `Find a direct high-quality book cover URL for "${title}" by ${author}. Return ONLY the URL string.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        tools: [{ "google_search": {} }]
                    })
                });
                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                const urlMatch = text.match(/https?:\/\/[^\s)]+/);
                if (urlMatch) {
                    state.form.coverUrl = urlMatch[0];
                    const img = document.getElementById('coverPreview');
                    img.src = state.form.coverUrl;
                    img.classList.remove('hidden');
                    document.getElementById('coverPlaceholder').classList.add('hidden');
                }
            } catch (e) { console.error(e); }
            loader.classList.add('hidden');
        }

        function previewManualCover(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    state.form.coverUrl = ev.target.result;
                    const img = document.getElementById('coverPreview');
                    img.src = state.form.coverUrl;
                    img.classList.remove('hidden');
                    document.getElementById('coverPlaceholder').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function toggleFavForm() {
            state.form.isFavorite = !state.form.isFavorite;
            updateFavForm();
        }

        function updateFavForm() {
            const icon = document.getElementById('favIconForm');
            const btn = document.getElementById('favBtnForm');
            if (state.form.isFavorite) {
                icon.classList.add('fill-current', 'text-[#e8608c]');
                icon.classList.remove('text-gray-200');
                btn.style.backgroundColor = 'rgba(232, 96, 140, 0.1)';
            } else {
                icon.classList.remove('fill-current', 'text-[#e8608c]');
                icon.classList.add('text-gray-200');
                btn.style.backgroundColor = 'transparent';
            }
        }

        function saveBook(e) {
            e.preventDefault();
            if (!state.form.format) return alert('Por favor, selecciona un formato (Papel o Ebook)');

            const book = {
                id: state.editingId || Date.now(),
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                rating: state.form.rating,
                coverUrl: state.form.coverUrl || 'https://images.unsplash.com/photo-1543003923-4350ffcc124c?w=400',
                isFavorite: state.form.isFavorite,
                format: state.form.format
            };

            if (state.editingId) {
                if (state.activeTab === 'read') state.books = state.books.map(b => b.id === state.editingId ? book : b);
                else state.wishlist = state.wishlist.map(w => w.id === state.editingId ? book : w);
            } else {
                if (state.activeTab === 'read') state.books.unshift(book);
                else state.wishlist.unshift(book);
            }

            saveToStorage();
            renderGrid();
            toggleAddForm();
            updateYearCount();
        }

        function saveToStorage() {
            localStorage.setItem('books', JSON.stringify(state.books));
            localStorage.setItem('wishlist', JSON.stringify(state.wishlist));
        }

        function switchTab(tab) {
            state.activeTab = tab;
            document.getElementById('tabRead').className = tab === 'read' ? 'tab-active px-10 py-4 rounded-2xl font-light transition-all border-2 border-turquesa-soft flex items-center gap-2' : 'px-10 py-4 rounded-2xl font-light transition-all border-2 border-turquesa-soft bg-white flex items-center gap-2 text-[#71cbc4]';
            document.getElementById('tabWish').className = tab === 'wishlist' ? 'tab-active px-10 py-4 rounded-2xl font-light transition-all border-2 border-turquesa-soft flex items-center gap-2' : 'px-10 py-4 rounded-2xl font-light transition-all border-2 border-turquesa-soft bg-white flex items-center gap-2 text-[#71cbc4]';
            
            if (state.isAdding) resetForm();
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = '';
            const items = state.activeTab === 'read' ? state.books : state.wishlist;

            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-32 flex flex-col items-center justify-center bg-white/60 rounded-[5rem] border-4 border-dashed border-[#71cbc4]/20">
                        <i data-lucide="${state.activeTab === 'read' ? 'book-open' : 'bookmark'}" class="w-20 h-20 mb-8 opacity-20 text-[#e8608c]"></i>
                        <p class="font-bold uppercase tracking-[0.4em] text-[10px] opacity-30">Nada por aquí todavía</p>
                    </div>
                `;
            } else {
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-[3.5rem] shadow-xl border-2 border-[#71cbc4]/10 overflow-hidden flex h-80 group hover:shadow-2xl transition-all duration-500";
                    card.innerHTML = `
                        <div class="w-52 h-full relative overflow-hidden bg-gray-50 flex-shrink-0">
                            <img src="${item.coverUrl}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt="${item.title}">
                            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center gap-4 p-4">
                                <button onclick="editItem(${item.id})" class="bg-white p-4 rounded-full shadow-2xl text-[#e8608c] hover:scale-110 transition-transform"><i data-lucide="edit-3" class="w-7 h-7"></i></button>
                                <button onclick="toggleFav(${item.id})" class="bg-white p-4 rounded-full shadow-2xl text-[#e8608c] hover:scale-110 transition-transform"><i data-lucide="heart" class="w-7 h-7 ${item.isFavorite ? 'fill-current' : ''}"></i></button>
                            </div>
                            ${item.isFavorite ? `<div class="absolute top-6 left-6 p-2 bg-white rounded-full shadow-lg text-[#e8608c]"><i data-lucide="heart" class="w-4 h-4 fill-current"></i></div>` : ''}
                            <div class="absolute bottom-4 right-4 px-3 py-1 rounded-full bg-white/90 backdrop-blur-sm text-[8px] font-black uppercase tracking-widest shadow-lg flex items-center gap-2" style="color: ${item.format === 'Papel' ? 'var(--naranja)' : 'var(--turquesa)'}">
                                <i data-lucide="${item.format === 'Papel' ? 'library' : 'tablet'}" class="w-3 h-3"></i>
                                ${item.format}
                            </div>
                        </div>
                        <div class="flex-1 p-8 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start">
                                    <div class="max-w-[85%]">
                                        <h3 class="font-light text-2xl leading-none truncate uppercase tracking-tighter mb-2">${item.title}</h3>
                                        <p class="font-bold text-lg opacity-60 text-[#71cbc4]">${item.author}</p>
                                    </div>
                                    <button onclick="deleteItem(${item.id})" class="p-2 rounded-full hover:bg-red-50 text-gray-200 hover:text-red-500"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                                </div>
                                ${state.activeTab === 'read' ? `
                                <div class="mt-8 flex items-center gap-2 font-bold text-[9px] uppercase tracking-[0.2em] opacity-40">
                                    <i data-lucide="calendar" class="w-4 h-4"></i>
                                    <span>${item.startDate || 'Sin fecha'}</span>
                                    <i data-lucide="chevron-right" class="w-3 h-3"></i>
                                    <span>${item.endDate || 'En curso'}</span>
                                </div>` : `
                                <button onclick="moveToRead(${item.id})" class="mt-8 font-bold text-[10px] text-[#e8608c] uppercase tracking-[0.2em] flex items-center gap-2 hover:translate-x-2 transition-transform">
                                    Empezar a leer <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </button>
                                `}
                            </div>
                            ${state.activeTab === 'read' ? `
                            <div class="flex items-center justify-between pt-6 border-t border-[#fff9f4]">
                                <div class="flex gap-1.5">
                                    ${[1,2,3,4,5].map(s => `<i data-lucide="star" class="w-5 h-5 ${item.rating >= s ? 'text-[#ffbd68] fill-current' : 'text-gray-100'}"></i>`).join('')}
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-[8px] font-bold uppercase opacity-30 tracking-tighter">${item.endDate ? 'Finalizado' : 'Leyendo'}</span>
                                    <div class="w-3.5 h-3.5 rounded-full shadow-inner" style="background-color: ${item.endDate ? 'var(--lima)' : 'var(--naranja)'}"></div>
                                </div>
                            </div>` : ''}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
            lucide.createIcons();
        }

        function deleteItem(id) {
            if (state.activeTab === 'read') state.books = state.books.filter(b => b.id !== id);
            else state.wishlist = state.wishlist.filter(w => w.id !== id);
            saveToStorage();
            renderGrid();
            updateYearCount();
        }

        function toggleFav(id) {
            if (state.activeTab === 'read') state.books = state.books.map(b => b.id === id ? {...b, isFavorite: !b.isFavorite} : b);
            else state.wishlist = state.wishlist.map(w => w.id === id ? {...w, isFavorite: !w.isFavorite} : w);
            saveToStorage();
            renderGrid();
        }

        function editItem(id) {
            const item = (state.activeTab === 'read' ? state.books : state.wishlist).find(x => x.id === id);
            if (!item) return;

            if (!state.isAdding) toggleAddForm();
            
            state.editingId = id;
            state.form = { ...item };
            document.getElementById('title').value = item.title;
            document.getElementById('author').value = item.author;
            document.getElementById('startDate').value = item.startDate || '';
            document.getElementById('endDate').value = item.endDate || '';
            
            const img = document.getElementById('coverPreview');
            img.src = item.coverUrl;
            img.classList.remove('hidden');
            document.getElementById('coverPlaceholder').classList.add('hidden');
            
            updateStars();
            updateFormatBtns();
            updateFavForm();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function moveToRead(id) {
            const item = state.wishlist.find(x => x.id === id);
            state.wishlist = state.wishlist.filter(x => x.id !== id);
            state.books.unshift({ ...item, startDate: new Date().toISOString().split('T')[0], endDate: '', rating: 0 });
            saveToStorage();
            switchTab('read');
        }

        function updateYearCount() {
            const year = new Date().getFullYear();
            const count = state.books.filter(b => b.endDate && b.endDate.startsWith(year)).length;
            document.getElementById('yearCount').innerText = count;
        }

        function updateIcons() { lucide.createIcons(); }

        function exportData() {
            const data = JSON.stringify({ books: state.books, wishlist: state.wishlist }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `diario_lecturas_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function handleImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const json = JSON.parse(ev.target.result);
                    if (json.books) state.books = json.books;
                    if (json.wishlist) state.wishlist = json.wishlist;
                    saveToStorage();
                    renderGrid();
                    updateYearCount();
                } catch (err) { alert('Error al importar archivo'); }
            };
            reader.readAsText(file);
        }

        window.onload = init;
    </script>
</body>
</html>
